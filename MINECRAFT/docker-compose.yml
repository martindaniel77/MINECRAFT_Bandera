version: '3.8'

services:
  minecraft-ctf:
    build: .
    container_name: minecraft_ctf_dvwa
    restart: on-failure:3
    ports:
      - "8080:8080"
    environment:
      - FLASK_ENV=production
      - PYTHONUNBUFFERED=1
      - PYTHONDONTWRITEBYTECODE=1
      - MALLOC_ARENA_MAX=2
    # Optimizado para VM en VirtualBox (4GB RAM, 2 vCPUs):
    # - cpus: "1.50" deja CPU disponible para evitar congelamientos en Kali (XFCE, Firefox, Burp Suite)
    # - mem_limit: 512m y mem_reservation: 128m aseguran rendimiento sin acaparar la RAM de la VM
    mem_limit: 512m
    mem_reservation: 128m
    cpus: "1.50"
    pids_limit: 128
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - ctf_net

networks:
  ctf_net:
    driver: bridge
